<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container my-5 mt-5">

        <h1 class="text-center text-danger">
            <strong class="text-center text-primary"> CRUD </strong> APPLICATION
        </h1>

        <form id="userform">

            <div class="row my-5">
<input type="text" id="editstatus" hidden>
                <div class="col-lg-4">
                    <input id="username"
                        type="text"
                        placeholder="Enter your name"
                        class="form-control">
                </div>

                <div class="col-lg-4">
                    <input id="email"
                        type="text"
                        placeholder="Enter your mail"
                        class="form-control">
                </div>

                <div class="col-lg-4">
                    <button type="submit"
                        class="btn btn-success w-100">
                        Save
                    </button>
                </div>

            </div>

        </form>

        <table class="my-5 table table-bordered table-hover">

            <thead class="table-dark text-light text-center">

                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="usertable">

                

            </tbody>

        </table>

    </div>

   

</body>
 <script src="./main.js"></script>
</html>
